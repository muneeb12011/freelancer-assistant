<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aurelance — the back office for independent work</title>
    <meta name="description" content="Clients, invoices, tasks and your network in one ledger. Aurelance is the back office for freelancers who bill every month." />
    <meta name="application-name" content="Aurelance" />
    <meta name="theme-color" content="#0C1612" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://freelancers-assistant.vercel.app/" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.webmanifest" />

    <!-- Open Graph / social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aurelance" />
    <meta property="og:title" content="Aurelance — the back office for independent work" />
    <meta property="og:description" content="Clients, invoices, tasks and your network in one ledger." />
    <meta property="og:url" content="https://freelancers-assistant.vercel.app/" />
    <meta property="og:image" content="https://freelancers-assistant.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aurelance — Know who owes you, what's due, and what's next." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurelance — the back office for independent work" />
    <meta name="twitter:description" content="Clients, invoices, tasks and your network in one ledger." />
    <meta name="twitter:image" content="https://freelancers-assistant.vercel.app/og-image.png" />

    <!-- Warm the API connection early -->
    <link rel="preconnect" href="https://freelancer-backend-khaki.vercel.app" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Aurelance",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Client CRM, invoicing, task board and time tracking for freelancers.",
        "url": "https://freelancers-assistant.vercel.app/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <style>
      /* Paint the brand background before CSS loads — no white flash */
      html, body { background: #0C1612; }
    </style>
  </head>
  <body>
    <noscript>Aurelance needs JavaScript to run. Enable it in your browser settings and reload.</noscript>
    <div id="root"></div>
  </body>
</html>
